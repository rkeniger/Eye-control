<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People Tracker</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --border: #deddd8;
    --live: #1f9d55;
    --warn: #c27c0e;
    --idle: #8a8a85;
    --stage: #e6e5e1;
    --accent: #2563eb;
    --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --surface: #1b1b1a;
      --text: #ecebe6;
      --muted: #9a9993;
      --border: #2e2e2c;
      --live: #3ccf7c;
      --warn: #e8a33a;
      --idle: #77766f;
      --stage: #0a0a0a;
      --accent: #4f8cff;
      --accent-text: #0b0b0b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 24px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .status[data-state="live"] .dot { background: var(--live); }
  .status[data-state="connecting"] .dot,
  .status[data-state="reconnecting"] .dot,
  .status[data-state="offline"] .dot { background: var(--warn); }
  .status[data-state="eye-ok"] .dot { background: var(--live); }
  .status[data-state="eye-off"] .dot { background: var(--warn); }
  .stats { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 600; }
  .stat span { color: var(--muted); margin-left: 4px; }
  label.conf { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; }
  label.conf output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 3ch; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 16px;
    padding: 16px;
  }
  .view { flex: 1; min-width: 0; min-height: 0; display: grid; place-items: center; }
  aside {
    width: 320px;
    flex-shrink: 0;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  aside[hidden] { display: none; }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside p { color: var(--muted); margin: 0 0 12px; }
  @media (max-width: 800px) {
    main { flex-direction: column; overflow-y: auto; }
    aside { width: 100%; }
  }
  button {
    font: inherit;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .pad {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: var(--stage);
    border-radius: 6px;
    touch-action: none;
    cursor: crosshair;
    margin-bottom: 12px;
  }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--border); }
  .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .pad::after { top: 50%; left: 0; right: 0; height: 1px; }
  .knob { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); z-index: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .msg { min-height: 1.4em; font-size: 13px; }
  ol.points { margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; font-size: 13px; }
  ol.points li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--border); }
  ol.points li span { flex: 1; }
  ol.points button { padding: 2px 8px; }
  .stage {
    position: relative;
    background: var(--stage);
    border-radius: 6px;
    overflow: hidden;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;
    width: 100%;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .stage.stale canvas { filter: grayscale(1) brightness(0.6); }
  .banner {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 15px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none;
  }
  .banner[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>People Tracker</h1>
  <span class="status" id="status" data-state="offline"><span class="dot"></span><span id="statusText">Connecting…</span></span>
  <div class="stats">
    <div class="stat"><b id="count">–</b><span>people</span></div>
    <div class="stat"><b id="fps">–</b><span>fps</span></div>
    <div class="stat"><b id="lag">–</b><span>ms lag</span></div>
  </div>
  <span class="status" id="eyeStatus" data-state="idle"><span class="dot"></span><span id="eyeText">Eye: –</span></span>
  <label class="conf">Min confidence
    <input type="range" id="conf" min="0.25" max="0.9" step="0.05" value="0.4">
    <output id="confOut">0.40</output>
  </label>
  <button id="calibrate" aria-pressed="false">Calibrate eye</button>
</header>
<main>
  <div class="view">
    <div class="stage stale" id="stage">
      <canvas id="canvas"></canvas>
      <div class="banner" id="banner">Connecting…</div>
    </div>
  </div>
  <aside id="panel" hidden>
    <h2>Teach the eye</h2>
    <p>Stand somewhere in view, alone. Drag the pad until the eye looks straight at you, then save the point. Repeat at <span id="minPoints">3</span>+ spread-out spots, including near and far.</p>
    <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
    <div class="actions">
      <button class="primary" id="savePoint" disabled>Save point</button>
      <button id="clearPoints">Clear all</button>
    </div>
    <div class="msg" id="teachMsg"></div>
    <ol class="points" id="points"></ol>
  </aside>
</main>
<script>
const TRAIL_MS = 2000;
const STATUS_TEXT = {
  idle: "Idle",
  connecting: "Connecting to camera…",
  reconnecting: "Camera lost, reconnecting…",
  live: "Live",
  offline: "Server unreachable, retrying…",
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const banner = document.getElementById("banner");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const countEl = document.getElementById("count");
const fpsEl = document.getElementById("fps");
const lagEl = document.getElementById("lag");
const confInput = document.getElementById("conf");
const confOut = document.getElementById("confOut");

let minConf = Number(confInput.value);
try {
  const saved = localStorage.getItem("minConf");
  if (saved) { minConf = Number(saved); confInput.value = saved; }
} catch {}
confOut.textContent = minConf.toFixed(2);
confInput.addEventListener("input", () => {
  minConf = Number(confInput.value);
  confOut.textContent = minConf.toFixed(2);
  try { localStorage.setItem("minConf", confInput.value); } catch {}
  if (lastFrame) draw(lastFrame);
});

const trails = new Map(); // track id -> [{x, y, t}]
let lastFrame = null;     // {bitmap, people}
let pending = null;       // newest decoded frame waiting for the next animation frame

const colorFor = id => `hsl(${(id * 137.508) % 360} 85% 55%)`;

function setStatus(state, detail) {
  statusEl.dataset.state = state;
  statusText.textContent = STATUS_TEXT[state] ?? state;
  const live = state === "live";
  stage.classList.toggle("stale", !live);
  banner.hidden = live;
  banner.textContent = (STATUS_TEXT[state] ?? state) + (detail ? ` (${detail})` : "");
}

function updateTrails(people, now) {
  for (const p of people) {
    const [x1, , x2, y2] = p.box;
    let trail = trails.get(p.id);
    if (!trail) trails.set(p.id, trail = []);
    trail.push({ x: (x1 + x2) / 2, y: y2, t: now });
  }
  for (const [id, trail] of trails) {
    while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
    if (!trail.length) trails.delete(id);
  }
}

function draw({ bitmap, people, target }) {
  if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    stage.style.aspectRatio = `${bitmap.width} / ${bitmap.height}`;
  }
  const W = canvas.width, H = canvas.height, now = performance.now();
  ctx.drawImage(bitmap, 0, 0);

  const visible = people.filter(p => p.conf >= minConf || p.id === target);
  const visibleIds = new Set(visible.map(p => p.id));
  countEl.textContent = visible.length;

  // Taught calibration points, while teaching.
  if (teaching && eyeState?.points) {
    const r = Math.max(6, W / 160);
    ctx.lineWidth = 2;
    ctx.font = `600 ${Math.round(r * 1.6)}px system-ui, sans-serif`;
    ctx.textBaseline = "middle";
    eyeState.points.forEach((p, i) => {
      ctx.strokeStyle = "#fff";
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.beginPath();
      ctx.arc(p.u * W, p.v * H, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillText(String(i + 1), p.u * W + r * 1.5, p.v * H);
    });
  }

  // Trails: feet position over the last couple of seconds, fading with age.
  ctx.lineWidth = Math.max(2, W / 400);
  ctx.lineCap = "round";
  for (const [id, trail] of trails) {
    if (!visibleIds.has(id) || trail.length < 2) continue;
    ctx.strokeStyle = colorFor(id);
    for (let i = 1; i < trail.length; i++) {
      ctx.globalAlpha = Math.max(0, 1 - (now - trail[i].t) / TRAIL_MS);
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x * W, trail[i - 1].y * H);
      ctx.lineTo(trail[i].x * W, trail[i].y * H);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  const fontPx = Math.max(12, Math.round(W / 80));
  ctx.font = `600 ${fontPx}px system-ui, sans-serif`;
  ctx.textBaseline = "top";
  for (const p of visible) {
    const [x1, y1, x2, y2] = p.box;
    const x = x1 * W, y = y1 * H, w = (x2 - x1) * W, h = (y2 - y1) * H;
    const color = colorFor(p.id);
    const isTarget = p.id === target;
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, W / 500) * (isTarget ? 2.5 : 1);
    ctx.strokeRect(x, y, w, h);
    if (isTarget) {
      // Where the eye is aiming: face height on the box.
      const ax = x + w / 2, ay = y + h * 0.15, r = Math.max(5, W / 200);
      ctx.beginPath();
      ctx.arc(ax, ay, r, 0, Math.PI * 2);
      ctx.moveTo(ax - r * 2, ay); ctx.lineTo(ax + r * 2, ay);
      ctx.moveTo(ax, ay - r * 2); ctx.lineTo(ax, ay + r * 2);
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const label = `${isTarget ? "◉ " : ""}#${p.id} ${p.conf.toFixed(2)}`;
    const pad = fontPx * 0.3;
    const tw = ctx.measureText(label).width + pad * 2;
    const th = fontPx + pad * 2;
    const ly = y - th >= 0 ? y - th : y;
    ctx.fillStyle = color;
    ctx.fillRect(x, ly, tw, th);
    ctx.fillStyle = "#000";
    ctx.fillText(label, x + pad, ly + pad);
  }
}

function render() {
  if (pending) {
    lastFrame?.bitmap.close();
    lastFrame = pending;
    pending = null;
    draw(lastFrame);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

async function onFrame(buf) {
  const view = new DataView(buf);
  const metaLen = view.getUint32(0, true);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, metaLen)));
  const bitmap = await createImageBitmap(new Blob([new Uint8Array(buf, 4 + metaLen)], { type: "image/jpeg" }));
  updateTrails(meta.people, performance.now());
  fpsEl.textContent = meta.fps.toFixed(1);
  lagEl.textContent = meta.lag_ms;
  if (meta.eye) renderEyeSummary(meta.eye);
  pending?.bitmap.close();
  pending = { bitmap, people: meta.people, target: meta.target ?? null };
}

// ---- eye status + teach panel ------------------------------------------------

const EYE_TEXT = { tracking: "tracking", hold: "holding", drift: "looking around", sleep: "asleep" };
const panel = document.getElementById("panel");
const pad = document.getElementById("pad");
const knob = document.getElementById("knob");
const teachMsg = document.getElementById("teachMsg");
let teaching = false;
let eyeState = null;     // full /api/eye state while the panel is open
let teachGaze = { yaw: 0, pitch: 0 };
let dragging = false;

function renderEyeSummary(e) {
  const el = document.getElementById("eyeStatus");
  let text;
  if (!e.enabled) text = "Eye: disabled";
  else if (!e.connected) text = "Eye: not connected";
  else if (e.teaching) text = "Eye: teaching";
  else if (e.mode === "manual") text = "Eye: manual control";
  else text = `Eye: ${EYE_TEXT[e.state] ?? e.state ?? "–"}${e.calibrated ? "" : " (uncalibrated)"}`;
  el.dataset.state = e.enabled && e.connected ? "eye-ok" : "eye-off";
  document.getElementById("eyeText").textContent = text;
  document.getElementById("savePoint").disabled = !(teaching && e.connected);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function limits() {
  return eyeState?.limits ?? eyeState?.status?.limits ?? { yaw: [-30, 30], pitch: [-20, 20] };
}

function placeKnob() {
  const { yaw: [y0, y1], pitch: [p0, p1] } = limits();
  knob.style.left = `${((teachGaze.yaw - y0) / (y1 - y0 || 1)) * 100}%`;
  knob.style.top = `${(1 - (teachGaze.pitch - p0) / (p1 - p0 || 1)) * 100}%`;
}

function renderTeach(state) {
  eyeState = state;
  renderEyeSummary(state);
  document.getElementById("minPoints").textContent = state.minPoints;
  if (!dragging && state.teachGaze) {
    teachGaze = { yaw: state.teachGaze[0], pitch: state.teachGaze[1] };
    placeKnob();
  }
  const list = document.getElementById("points");
  list.innerHTML = "";
  state.points.forEach((p, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${i + 1}. (${p.u.toFixed(2)}, ${p.v.toFixed(2)}) → ${p.yaw}°, ${p.pitch}°</span><button>Delete</button>`;
    li.querySelector("button").onclick = () => api("DELETE", `/api/calibration/points/${i}`).then(renderTeach);
    list.appendChild(li);
  });
  if (!state.connected) teachMsg.textContent = "Eye is not connected.";
  else if (state.status?.mode === "manual") teachMsg.textContent = "Eye is under manual control on its own page; switch it to Auto.";
  else if (state.points.length < state.minPoints) teachMsg.textContent = `${state.points.length}/${state.minPoints} points. Until then a rough default mapping is used.`;
  else teachMsg.textContent = `${state.points.length} points taught.`;
  if (lastFrame) draw(lastFrame);
}

// One request in flight at a time, always sending the newest aim.
let aimPending = null, aimBusy = false;
async function sendAim(aim) {
  aimPending = aim;
  if (aimBusy) return;
  aimBusy = true;
  while (aimPending) {
    const a = aimPending;
    aimPending = null;
    try { await api("POST", "/api/teach/aim", a); } catch (e) { teachMsg.textContent = e.message; }
  }
  aimBusy = false;
}

function onPad(e) {
  const r = pad.getBoundingClientRect();
  const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  const { yaw: [y0, y1], pitch: [p0, p1] } = limits();
  teachGaze = { yaw: +(y0 + fx * (y1 - y0)).toFixed(1), pitch: +(p1 - fy * (p1 - p0)).toFixed(1) };
  placeKnob();
  sendAim(teachGaze);
}
pad.addEventListener("pointerdown", e => { dragging = true; pad.setPointerCapture(e.pointerId); onPad(e); });
pad.addEventListener("pointermove", e => { if (dragging) onPad(e); });
pad.addEventListener("pointerup", () => { dragging = false; });
pad.addEventListener("pointercancel", () => { dragging = false; });

let teachTimer = null;
async function setTeaching(on) {
  teaching = on;
  panel.hidden = !on;
  document.getElementById("calibrate").setAttribute("aria-pressed", on);
  clearInterval(teachTimer);
  try {
    renderTeach(await api("POST", "/api/teach", { active: on }));
  } catch (e) {
    teachMsg.textContent = e.message;
  }
  // Keep teach mode alive (it times out server-side) and refresh state while the panel is open.
  if (on) teachTimer = setInterval(() => api("POST", "/api/teach", { active: true }).then(renderTeach).catch(() => {}), 3000);
}

document.getElementById("calibrate").onclick = () => setTeaching(!teaching);
document.getElementById("savePoint").onclick = async () => {
  try {
    renderTeach(await api("POST", "/api/calibration/points"));
  } catch (e) {
    teachMsg.textContent = e.message;
  }
};
document.getElementById("clearPoints").onclick = async () => {
  if (confirm("Delete all taught points?")) renderTeach(await api("DELETE", "/api/calibration/points"));
};
window.addEventListener("pagehide", () => {
  if (teaching) fetch("/api/teach", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: '{"active":false}' });
});
api("GET", "/api/eye").then(renderEyeSummary).catch(() => {});

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      const msg = JSON.parse(e.data);
      if (msg.type === "status") setStatus(msg.state, msg.detail);
    } else {
      onFrame(e.data);
    }
  };
  ws.onclose = () => {
    setStatus("offline");
    setTimeout(connect, 1500);
  };
}
connect();
</script>
</body>
</html>
