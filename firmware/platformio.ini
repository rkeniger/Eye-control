; ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
[platformio]
default_envs = eyeball

; Over USB: pio run -t upload
[env:eyeball]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Two 6.4 MB app slots for OTA updates.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
extra_scripts = pre:scripts/prebuild.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.4.0
    bblanchon/ArduinoJson @ ^7.2.0

; Over Wi-Fi: pio run -e ota -t upload  (or scripts/ota.sh). Set upload_port to override the host.
[env:ota]
extends = env:eyeball
upload_protocol = custom
upload_port = eyeball.local
upload_command = scripts/ota.sh --file $SOURCE $UPLOAD_PORT
